name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/test/' }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public production app
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PYTHON'
          import os, re, time, urllib.request, urllib.parse
          url = os.environ['PAGES_URL']
          for attempt in range(12):
              try:
                  html = urllib.request.urlopen(url, timeout=20).read().decode()
                  asset = re.search(r'src="([^"]*/assets/[^" ]+\.js)"', html)
                  assert asset, 'Pages is not serving the compiled app yet'
                  urllib.request.urlopen(urllib.parse.urljoin(url, asset.group(1)), timeout=20).read(100)
                  print('Verified public HTML and production JavaScript:', url)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PYTHON
